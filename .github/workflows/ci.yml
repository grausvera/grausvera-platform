name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://grausvera:local-password@127.0.0.1:5432/grausvera
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_DB: grausvera
          POSTGRES_PASSWORD: local-password
          POSTGRES_USER: grausvera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grausvera -d grausvera"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Migrate empty database
        run: npm run db:migrate
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Run unit smoke tests
        run: npm run test:unit
      - name: Run database integration tests
        run: npm run test:integration
      - name: Run provider contract tests
        run: npm run test:contracts
      - name: Build
        run: npm run build
      - name: Build OCI image
        run: docker build --tag grausvera-platform:${{ github.sha }} .
      - name: Run browser smoke test
        run: npm run test:e2e
