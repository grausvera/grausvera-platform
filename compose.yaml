name: ${COMPOSE_PROJECT_NAME:-grausvera-platform-local}

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: grausvera
      POSTGRES_PASSWORD: local-password
      POSTGRES_USER: grausvera
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grausvera -d grausvera"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  s3:
    image: adobe/s3mock:5.1.0
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: grausvera-local
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /containers3root
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${S3_PORT:-9090}:9090"
    volumes:
      - object-data:/containers3root

volumes:
  object-data:
  postgres-data:
